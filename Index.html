<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio</title>
  <style>
    /* Estilos para centrar todo en la pantalla */
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #212121; /* Fondo oscuro opcional para que resalte el botón */
    }

    /* Estilos de tu botón */
    button {
      background-color: transparent;
      border: none;
      padding: 0;
      cursor: pointer;
    }

    a {
      position: relative;
      display: inline-block;
      padding: 15px 30px;
      border: 2px solid #ebecf6;
      text-transform: uppercase;
      color: #ebecf6;
      text-decoration: none;
      font-weight: 600;
      font-size: 20px;
    }

    a::before {
      content: '';
      position: absolute;
      top: 6px;
      left: -2px;
      width: calc(100% + 4px);
      height: calc(100% - 12px);
      background-color: #212121;
      transition: 0.3s ease-in-out;
      transform: scaleY(1);
    }

    a:hover::before {
      transform: scaleY(0);
    }

    a::after {
      content: '';
      position: absolute;
      left: 6px;
      top: -2px;
      height: calc(100% + 4px);
      width: calc(100% - 12px);
      background-color: #212121;
      transition: 0.3s ease-in-out;
      transform: scaleX(1);
      transition-delay: 0.5s;
    }

    a:hover::after {
      transform: scaleX(0);
    }

    a span {
      position: relative;
      z-index: 3;
    }
  </style>
</head>
<body>

  <button>
    <a href="Inicio.html"><span>Click para ver la grasa activa</span></a> 
  </button>

</body>
</html>
