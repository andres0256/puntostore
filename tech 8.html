<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="logo.png">
  <title>Sudadera nike tech - Punto Store</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #121212; color: #ffffff; min-height: 100vh; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; background-color: #1a1a1a; border-bottom: 1px solid #2a2a2a; }
    .logo img { height: 40px; width: auto; display: block; }
    .nav-links { display: flex; gap: 20px; font-size: 0.9rem; font-weight: 600; text-transform: uppercase; align-items: center; }
    .nav-links a { color: #ccc; text-decoration: none; transition: color 0.3s; }
    .nav-links a:hover { color: #fff; }

    .btn-admin-header {
      background: transparent;
      border: 1px solid #00ff88;
      color: #00ff88;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.75rem;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }
    .btn-admin-header:hover { background: #00ff88; color: #000; }

    .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
    
    .product-gallery { display: flex; flex-direction: column; gap: 15px; }
    .main-image-container img { width: 100%; height: 450px; border-radius: 8px; object-fit: cover; background-color: #222; border: 1px solid #333; }
    .thumbnails-grid { display: flex; gap: 10px; }
    .thumb-img { width: 70px; height: 70px; border-radius: 6px; object-fit: cover; background-color: #222; cursor: pointer; border: 2px solid transparent; transition: border-color 0.2s; }
    .thumb-img:hover, .thumb-img.activo { border-color: #25d366; }

    .product-details { display: flex; flex-direction: column; gap: 15px; }
    .breadcrumb { font-size: 0.85rem; color: #888; }
    .product-title { font-size: 2rem; font-weight: 700; text-transform: lowercase; }
    .product-price { font-size: 1.8rem; font-weight: 800; }
    .section-label { font-size: 0.9rem; color: #aaa; margin-top: 10px; }

    .sizes-grid { display: flex; gap: 10px; }
    .size-btn { background: transparent; border: 1px solid #444; color: #fff; padding: 10px 18px; font-weight: bold; cursor: pointer; border-radius: 4px; transition: all 0.2s; }
    .size-btn:hover:not(.out-of-stock) { border-color: #fff; }
    .size-btn.active { background-color: #fff; color: #000; border-color: #fff; }
    .size-btn.out-of-stock { opacity: 0.3; cursor: not-allowed; border-color: #222; text-decoration: line-through; }

    .admin-stock-panel { display: block; font-size: 0.85rem; color: #00ff88; background: #1e261f; padding: 10px; border-radius: 4px; border: 1px dashed #00ff88; margin-top: 5px; }

    .modal-editor { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; }
    .modal-content { background: #1e1e1e; padding: 25px; border-radius: 8px; width: 340px; border: 1px solid #00ff88; box-shadow: 0 0 15px rgba(0,255,136,0.2); }
    .modal-content h3 { color: #00ff88; margin-bottom: 15px; text-align: center; }
    
    .fila-stock { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .fila-stock input { width: 70px; padding: 5px; background: #121212; border: 1px solid #444; color: #fff; text-align: center; border-radius: 4px; font-weight: bold; }
    
    .btn-modal-accion { width: 100%; padding: 10px; background: #00ff88; border: none; color: #000; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 15px; }
    .btn-cerrar-modal { width: 100%; padding: 6px; background: transparent; border: none; color: #888; cursor: pointer; margin-top: 8px; font-size: 0.8rem; }

    .purchase-row { display: flex; gap: 15px; margin-top: 10px; }
    .quantity-selector { display: flex; align-items: center; border: 1px solid #444; border-radius: 4px; }
    .quantity-btn { background: none; border: none; color: #fff; padding: 10px 15px; cursor: pointer; font-size: 1.1rem; }
    .quantity-input { width: 40px; text-align: center; background: none; border: none; color: #fff; font-weight: bold; font-size: 1rem; }
    .btn-cart { flex: 1; background-color: transparent; border: 1px solid #25d366; color: #25d366; font-weight: bold; cursor: pointer; border-radius: 4px; transition: all 0.2s; padding: 12px; display: flex; justify-content: center; align-items: center; gap: 8px; }
    .btn-cart:hover:not(:disabled) { background-color: #25d366; color: #000; }
    .btn-cart:disabled { border-color: #444; color: #555; cursor: not-allowed; }

    @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <header>
    <div class="logo"><a href="Inicio.html"><img src="logo.png" alt="Logo"></a></div>
    <div class="nav-links">
      <a href="Inicio.html">≡ Menú</a>
      <a href="Carrito.html">🛒 Carrito</a>
      <button class="btn-admin-header" onclick="abrirEditorStock()">⚙ Stock</button>
    </div>
  </header>

  <div class="container">
    <div class="product-gallery">
      <div class="main-image-container"><img id="main-img" src="tech 8.jpg" alt="Sudadera Nike Tech Verde"></div>
      <div class="thumbnails-grid">
        <img src="tech 8.jpg" class="thumb-img activo" onclick="seleccionarImagen(0, this)">
      </div>
    </div>

    <div class="product-details">
      <div class="breadcrumb">Inicio / Nike tech</div>
      <h1 class="product-title">Sudadera nike tech verde</h1>
      <div class="product-price">$250.000</div>

      <div class="section-label">Talla</div>
      <div class="sizes-grid">
        <button class="size-btn" data-talla="S" onclick="selectSize('S', this)">S</button>
        <button class="size-btn" data-talla="M" onclick="selectSize('M', this)">M</button>
        <button class="size-btn" data-talla="L" onclick="selectSize('L', this)">L</button>
        <button class="size-btn" data-talla="XL" onclick="selectSize('XL', this)">XL</button>
        <button class="size-btn" data-talla="XXL" onclick="selectSize('XXL', this)">XXL</button>
      </div>

      <div class="admin-stock-panel" id="admin-panel">
        <strong>[ESTADO]</strong> Talla seleccionada: <span id="admin-talla-lbl">-</span> | Stock disponible: <span id="admin-stock-val">0</span>
      </div>

      <div class="purchase-row">
        <div class="quantity-selector">
          <button class="quantity-btn" onclick="changeQty(-1)">-</button>
          <input type="text" class="quantity-input" id="qty" value="1" readonly>
          <button class="quantity-btn" onclick="changeQty(1)">+</button>
        </div>
        
        <button class="btn-cart" id="btn-add" onclick="addToCart()">🛒 Agregar al Carrito</button>
      </div>
    </div>
  </div>

  <!-- MODAL FLOTANTE EDITOR DE STOCK -->
  <div class="modal-editor" id="modalEditor">
    <div class="modal-content">
      <h3>Gestionar Inventario (Verde)</h3>
      <div id="cuerpoModal"></div>
      <button class="btn-cerrar-modal" onclick="cerrarModal()">Cancelar</button>
    </div>
  </div>

  <script>
    const CLAVE_ADMIN = "9876";
    const STOCK_KEY = "inventario_nike_verde_v1";

    const stockPorDefecto = { 'S': 4, 'M': 8, 'L': 6, 'XL': 3, 'XXL': 1 };

    let inventarioVerde = JSON.parse(localStorage.getItem(STOCK_KEY));
    if (!inventarioVerde || typeof inventarioVerde !== 'object') {
      inventarioVerde = stockPorDefecto;
      localStorage.setItem(STOCK_KEY, JSON.stringify(stockPorDefecto));
    }

    let selectedSize = '';
    let currentQty = 1;
    const precioNumerico = 250000;

    function seleccionarImagen(index, element) {
      document.querySelectorAll('.thumb-img').forEach(img => img.classList.remove('activo'));
      if (element) element.classList.add('activo');
    }

    function validarDisponibilidadTallas() {
      const botonesTalla = document.querySelectorAll('.size-btn');
      let primeraValida = null;

      botonesTalla.forEach(btn => {
        const talla = btn.getAttribute('data-talla');
        const stock = Number(inventarioVerde[talla]) || 0;

        btn.classList.remove('active', 'out-of-stock');

        if (stock <= 0) {
          btn.classList.add('out-of-stock');
        } else if (!primeraValida) {
          primeraValida = { talla, element: btn };
        }
      });

      if (primeraValida) {
        selectSize(primeraValida.talla, primeraValida.element);
      } else {
        selectedSize = '';
        document.getElementById('btn-add').disabled = true;
        actualizarVistaAdmin(0);
      }
    }

    function selectSize(size, element) {
      const stock = Number(inventarioVerde[size]) || 0;
      if (stock <= 0) return;

      selectedSize = size;
      document.querySelectorAll('.size-btn').forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');

      resetQty();
      document.getElementById('btn-add').disabled = false;
      actualizarVistaAdmin(stock);
    }

    function resetQty() {
      currentQty = 1;
      document.getElementById('qty').value = currentQty;
    }

    function changeQty(amount) {
      if (!selectedSize) return;
      const maxStock = Number(inventarioVerde[selectedSize]) || 0;
      if (maxStock <= 0) return;

      if (currentQty + amount >= 1 && currentQty + amount <= maxStock) {
        currentQty += amount;
        document.getElementById('qty').value = currentQty;
      }
    }

    function addToCart() {
      if (!selectedSize) {
        alert("Por favor selecciona una talla.");
        return;
      }
      
      const maxStock = Number(inventarioVerde[selectedSize]) || 0;
      if (maxStock <= 0) {
        alert("Lo sentimos, no hay stock disponible para esta talla.");
        return;
      }

      let carrito = JSON.parse(localStorage.getItem('miCarrito')) || [];
      const nombreProd = `Sudadera Nike Tech Verde (Talla ${selectedSize})`;
      const rutaImagenActual = document.getElementById('main-img').getAttribute('src').trim();

      let productoExistente = carrito.find(item => item.nombre === nombreProd);

      if (productoExistente) {
        if (productoExistente.cantidad + currentQty > maxStock) {
          alert(`Solo puedes llevar un máximo de ${maxStock} unidades de esta talla.`);
          return;
        }
        productoExistente.cantidad += currentQty;
      } else {
        carrito.push({
          nombre: nombreProd,
          precio: precioNumerico,
          talla: selectedSize,
          cantidad: currentQty,
          imagen: rutaImagenActual
        });
      }

      localStorage.setItem('miCarrito', JSON.stringify(carrito));
      alert(`¡Agregado al carrito! (${currentQty} un. Talla: ${selectedSize})`);
      window.location.href = "Carrito.html";
    }

    function abrirEditorStock() {
      const cuerpo = document.getElementById('cuerpoModal');
      cuerpo.innerHTML = `
        <div id="bloquePass">
          <label style="font-size: 0.85rem; display:block; margin-bottom: 8px; color: #ccc;">Contraseña Admin:</label>
          <input type="password" id="passInput" style="width: 100%; padding: 10px; background: #121212; border: 1px solid #444; color: white; border-radius: 4px; font-size: 1rem;" placeholder="••••">
          <button class="btn-modal-accion" onclick="verificarPass()">Entrar</button>
        </div>
      `;
      document.getElementById('modalEditor').style.display = 'flex';
      setTimeout(() => {
        const inp = document.getElementById('passInput');
        if(inp) inp.focus();
      }, 100);
    }

    function verificarPass() {
      const inputPass = document.getElementById('passInput').value;
      if (inputPass !== CLAVE_ADMIN) {
        alert("Contraseña incorrecta.");
        return;
      }
      cargarCamposStock();
    }

    function cargarCamposStock() {
      const cuerpo = document.getElementById('cuerpoModal');
      cuerpo.innerHTML = `
        <p style="font-size:0.85rem; color:#00ff88; margin-bottom:12px; text-align:center;">Editando stock: <strong>Verde</strong></p>
        <div id="inputsStockContainer" style="max-height: 220px; overflow-y: auto; padding-right: 5px;"></div>
        <button class="btn-modal-accion" onclick="guardarNuevoStock()">Guardar Cambios</button>
      `;

      const contenedorInputs = document.getElementById('inputsStockContainer');
      contenedorInputs.innerHTML = '';

      ['S', 'M', 'L', 'XL', 'XXL'].forEach(talla => {
        const stockActual = Number(inventarioVerde[talla]) || 0;
        contenedorInputs.innerHTML += `
          <div class="fila-stock">
            <span style="font-size: 0.95rem;">Talla <strong>${talla}</strong>:</span>
            <input type="number" id="input-stock-${talla}" min="0" value="${stockActual}">
          </div>
        `;
      });
    }

    function guardarNuevoStock() {
      let nuevoInventario = {};
      ['S', 'M', 'L', 'XL', 'XXL'].forEach(talla => {
        const input = document.getElementById(`input-stock-${talla}`);
        if (input) {
          const val = parseInt(input.value);
          nuevoInventario[talla] = isNaN(val) ? 0 : val;
        }
      });

      inventarioVerde = nuevoInventario;
      localStorage.setItem(STOCK_KEY, JSON.stringify(inventarioVerde));
      
      cerrarModal();
      validarDisponibilidadTallas();
      alert("¡Stock actualizado correctamente!");
    }

    function cerrarModal() {
      document.getElementById('modalEditor').style.display = 'none';
    }

    function actualizarVistaAdmin(stock) {
      document.getElementById('admin-talla-lbl').innerText = selectedSize || 'N/A';
      document.getElementById('admin-stock-val').innerText = stock;
    }

    validarDisponibilidadTallas();
  </script>
</body>
</html>
