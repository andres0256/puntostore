<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="logo.png">
  <title>Sudadera nike tech- Punto Store</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      min-height: 100vh;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 5%;
      background-color: #1a1a1a;
      border-bottom: 1px solid #2a2a2a;
    }

    .logo img {
      height: 40px;
      width: auto;
      display: block;
    }

    .nav-links {
      display: flex;
      gap: 20px;
      font-size: 0.9rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .nav-links a {
      color: #ccc;
      text-decoration: none;
      transition: color 0.3s;
    }

    .nav-links a:hover {
      color: #fff;
    }

    .container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
    }

    .product-image img {
      width: 100%;
      border-radius: 8px;
      object-fit: cover;
      background-color: #222;
    }

    .product-details {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .breadcrumb {
      font-size: 0.85rem;
      color: #888;
    }

    .product-title {
      font-size: 2rem;
      font-weight: 700;
      text-transform: lowercase;
    }

    .product-price {
      font-size: 1.8rem;
      font-weight: 800;
    }

    .section-label {
      font-size: 0.9rem;
      color: #aaa;
      margin-top: 10px;
    }

    /* ESTILOS PARA LA SELECCIÓN DE COLOR */
    .colors-grid {
      display: flex;
      gap: 12px;
    }

    .color-btn {
      background: transparent;
      border: 1px solid #444;
      color: #fff;
      padding: 8px 16px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .color-swatch {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1px solid #666;
    }

    .color-swatch.negro { background-color: #000; }
    .color-swatch.blanco { background-color: #fff; }

    .color-btn:hover {
      border-color: #fff;
    }

    .color-btn.active {
      background-color: #333;
      border-color: #fff;
    }

    .sizes-grid {
      display: flex;
      gap: 10px;
    }

    .size-btn {
      background: transparent;
      border: 1px solid #444;
      color: #fff;
      padding: 10px 18px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .size-btn:hover {
      border-color: #fff;
    }

    .size-btn.active {
      background-color: #fff;
      color: #000;
      border-color: #fff;
    }

    .stock-info {
      font-size: 0.85rem;
      color: #00ff88;
      font-weight: 600;
    }

    .stock-info.out {
      color: #ff4444;
    }

    .purchase-row {
      display: flex;
      gap: 15px;
      margin-top: 10px;
    }

    .quantity-selector {
      display: flex;
      align-items: center;
      border: 1px solid #444;
      border-radius: 4px;
    }

    .quantity-btn {
      background: none;
      border: none;
      color: #fff;
      padding: 10px 15px;
      cursor: pointer;
      font-size: 1.1rem;
    }

    .quantity-input {
      width: 40px;
      text-align: center;
      background: none;
      border: none;
      color: #fff;
      font-weight: bold;
      font-size: 1rem;
    }

    .btn-cart {
      flex: 1;
      background-color: transparent;
      border: 1px solid #25d366;
      color: #25d366;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s;
      padding: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .btn-cart:hover {
      background-color: #25d366;
      color: #000;
    }

    @media (max-width: 768px) {
      .container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <a href="Inicio.html"><img src="logo.png" alt="Logo de la tienda"></a>
    </div>
    <div class="nav-links">
      <a href="Inicio.html">≡ Menú</a>
      <a href="Carrito.html">🛒 Carrito</a>
    </div>
  </header>

  <div class="container">
    <div class="product-image">
      <img src="tech 3.jpg" id="main-img" alt="Camiseta">
    </div>

    <div class="product-details">
      <div class="breadcrumb">Inicio / Nike tech</div>
      <h1 class="product-title" id="prod-title">Sudadera nike tech</h1>
      <div class="product-price" id="precio">$250.000</div>

      <!-- SECCIÓN DE SELECCIÓN DE COLOR -->
      <div class="section-label">Color</div>
      <div class="colors-grid">
        <button class="color-btn active" onclick="selectColor('Negro', this)">
          <span class="color-swatch negro"></span> Negro
        </button>
        
      </div>

      <div class="section-label">Talla</div>
      <div class="sizes-grid">
        <button class="size-btn active" onclick="selectSize('S', this)">S</button>
        <button class="size-btn" onclick="selectSize('M', this)">M</button>
        <button class="size-btn" onclick="selectSize('L', this)">L</button>
        <button class="size-btn" onclick="selectSize('XL', this)">XL</button>
         <button class="size-btn" onclick="selectSize('XXL', this)">XXL</button>
      </div>

      <div class="stock-info" id="stock-display">Disponibles: 8 unidades</div>

      <div class="purchase-row">
        <div class="quantity-selector">
          <button class="quantity-btn" onclick="changeQty(-1)">-</button>
          <input type="text" class="quantity-input" id="qty" value="1" readonly>
          <button class="quantity-btn" onclick="changeQty(1)">+</button>
        </div>
        
        <button class="btn-cart" onclick="addToCart()">🛒 Agregar al Carrito</button>
      </div>

    </div>
  </div>

  <script>
    // MATRIZ DE INVENTARIO SEPARADA POR COLOR Y TALLA
    const inventario = {
      'Negro': {
        'S': 0,
        'M': 0,
        'L': 0,
        'XL': 0,
        'XXL': 0 ,

      },
     
    };

    let selectedColor = 'Negro';
    let selectedSize = 'S';
    let currentQty = 1;
    const precioNumerico = 110000;

    function selectColor(color, element) {
      selectedColor = color;
      
      document.querySelectorAll('.color-btn').forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');

      resetQty();
      updateStockDisplay();
    }

    function selectSize(size, element) {
      selectedSize = size;
      
      document.querySelectorAll('.size-btn').forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');

      resetQty();
      updateStockDisplay();
    }

    function resetQty() {
      currentQty = 1;
      document.getElementById('qty').value = currentQty;
    }

    function updateStockDisplay() {
      const stock = inventario[selectedColor][selectedSize];
      const stockDisplay = document.getElementById('stock-display');

      if (stock > 0) {
        stockDisplay.innerText = `Disponibles: ${stock} unidades (${selectedColor})`;
        stockDisplay.className = "stock-info";
      } else {
        stockDisplay.innerText = `Agotado en color ${selectedColor} / Talla ${selectedSize}`;
        stockDisplay.className = "stock-info out";
      }
    }

    function changeQty(amount) {
      const maxStock = inventario[selectedColor][selectedSize];
      if (maxStock === 0) return;

      if (currentQty + amount >= 1 && currentQty + amount <= maxStock) {
        currentQty += amount;
        document.getElementById('qty').value = currentQty;
      }
    }

    function addToCart() {
      const maxStock = inventario[selectedColor][selectedSize];

      if (maxStock === 0) {
        alert('Esta combinación de color y talla se encuentra agotada por el momento.');
        return;
      }

      let carrito = JSON.parse(localStorage.getItem('miCarrito')) || [];
      
      const nombreProd = `Camiseta Mixed Emotion Angel (${selectedColor} - ${selectedSize})`;
      let productoExistente = carrito.find(item => item.nombre === nombreProd);

      if (productoExistente) {
        if (productoExistente.cantidad + currentQty > maxStock) {
          alert(`No puedes agregar más unidades. El stock máximo para este producto es ${maxStock}.`);
          return;
        }
        productoExistente.cantidad += currentQty;
      } else {
        carrito.push({
          nombre: nombreProd,
          precio: precioNumerico,
          color: selectedColor,
          talla: selectedSize,
          cantidad: currentQty
        });
      }

      localStorage.setItem('miCarrito', JSON.stringify(carrito));

      alert(`¡Agregado! ${currentQty} unidad(es) Color: ${selectedColor} / Talla: ${selectedSize}`);
      window.location.href = "Carrito.html";
    }

    updateStockDisplay();
  </script>

</body>
</html>
