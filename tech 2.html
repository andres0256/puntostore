<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="logo.png">
  <title>Sudadera Nike Tech - Punto Store</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      min-height: 100vh;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 5%;
      background-color: #1a1a1a;
      border-bottom: 1px solid #2a2a2a;
    }

    .logo img {
      height: 40px;
      width: auto;
      display: block;
    }

    .nav-links {
      display: flex;
      gap: 20px;
      font-size: 0.9rem;
      font-weight: 600;
      text-transform: uppercase;
      align-items: center;
    }

    .nav-links a {
      color: #ccc;
      text-decoration: none;
      transition: color 0.3s;
    }

    .nav-links a:hover {
      color: #fff;
    }

    .btn-admin-header {
      background: transparent;
      border: 1px solid #00ff88;
      color: #00ff88;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.75rem;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }
    .btn-admin-header:hover { background: #00ff88; color: #000; }

    .container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
    }

    /* ESTILOS PARA LAS IMÁGENES MÚLTIPLES */
    .product-gallery {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .main-image-container {
      width: 100%;
      background-color: #222;
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 1/1;
    }

    .main-image-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .thumbnails-container {
      display: flex;
      gap: 10px;
    }

    .thumb-btn {
      width: 70px;
      height: 70px;
      border-radius: 6px;
      border: 2px solid #444;
      background: #222;
      cursor: pointer;
      overflow: hidden;
      padding: 0;
      transition: all 0.2s;
    }

    .thumb-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .thumb-btn:hover {
      border-color: #888;
    }

    .thumb-btn.active {
      border-color: #00ff88;
    }

    .product-details {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .breadcrumb {
      font-size: 0.85rem;
      color: #888;
    }

    .product-title {
      font-size: 2rem;
      font-weight: 700;
      text-transform: lowercase;
    }

    .product-price {
      font-size: 1.8rem;
      font-weight: 800;
    }

    .section-label {
      font-size: 0.9rem;
      color: #aaa;
      margin-top: 10px;
    }

    .colors-grid {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .color-btn {
      background: transparent;
      border: 1px solid #444;
      color: #fff;
      padding: 8px 16px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .color-swatch {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1px solid #666;
    }

    .color-swatch.Negro { background-color: #000; }
    .color-swatch.Blanco { background-color: #fff; }

    .color-btn:hover {
      border-color: #fff;
    }

    .color-btn.active {
      background-color: #333;
      border-color: #fff;
    }

    .sizes-grid {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .size-btn {
      background: transparent;
      border: 1px solid #444;
      color: #fff;
      padding: 10px 18px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .size-btn:hover:not(.out-of-stock) {
      border-color: #fff;
    }

    .size-btn.active {
      background-color: #fff;
      color: #000;
      border-color: #fff;
    }

    .size-btn.out-of-stock {
      opacity: 0.3;
      cursor: not-allowed;
      border-color: #222;
      text-decoration: line-through;
    }

    .stock-info {
      font-size: 0.85rem;
      color: #00ff88;
      font-weight: 600;
    }

    .stock-info.out {
      color: #ff4444;
    }

    .admin-stock-panel { display: block; font-size: 0.85rem; color: #00ff88; background: #1e261f; padding: 10px; border-radius: 4px; border: 1px dashed #00ff88; margin-top: 5px; }

    .modal-editor { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; }
    .modal-content { background: #1e1e1e; padding: 25px; border-radius: 8px; width: 340px; border: 1px solid #00ff88; box-shadow: 0 0 15px rgba(0,255,136,0.2); max-height: 90vh; overflow-y: auto; }
    .modal-content h3 { color: #00ff88; margin-bottom: 15px; text-align: center; }
    .fila-stock { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .fila-stock input { width: 60px; padding: 5px; background: #121212; border: 1px solid #444; color: #fff; text-align: center; border-radius: 4px; font-weight: bold; }
    .btn-guardar-admin { width: 100%; padding: 10px; background: #00ff88; border: none; color: #000; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 15px; }
    .btn-cerrar-modal { width: 100%; padding: 6px; background: transparent; border: none; color: #888; cursor: pointer; margin-top: 5px; font-size: 0.8rem; }

    .purchase-row {
      display: flex;
      gap: 15px;
      margin-top: 10px;
    }

    .quantity-selector {
      display: flex;
      align-items: center;
      border: 1px solid #444;
      border-radius: 4px;
    }

    .quantity-btn {
      background: none;
      border: none;
      color: #fff;
      padding: 10px 15px;
      cursor: pointer;
      font-size: 1.1rem;
    }

    .quantity-input {
      width: 40px;
      text-align: center;
      background: none;
      border: none;
      color: #fff;
      font-weight: bold;
      font-size: 1rem;
    }

    .btn-cart {
      flex: 1;
      background-color: transparent;
      border: 1px solid #25d366;
      color: #25d366;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s;
      padding: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .btn-cart:hover:not(:disabled) {
      background-color: #25d366;
      color: #000;
    }

    .btn-cart:disabled {
      border-color: #444;
      color: #555;
      cursor: not-allowed;
    }

    @media (max-width: 768px) {
      .container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <a href="Inicio.html"><img src="logo.png" alt="Logo de la tienda"></a>
    </div>
    <div class="nav-links">
      <a href="Inicio.html">≡ Menú</a>
      <a href="Carrito.html">🛒 Carrito</a>
      <button class="btn-admin-header" onclick="abrirEditorStock()">⚙ Config Admin</button>
    </div>
  </header>

  <div class="container">
    <!-- GALERÍA DE 2 IMÁGENES -->
    <div class="product-gallery">
      <div class="main-image-container">
        <img src="tech 2.jpg" id="main-img" alt="Sudadera Nike Tech Vista Principal">
      </div>
      <div class="thumbnails-container">
        <button class="thumb-btn active" onclick="cambiarImagenPrincipal('tech 2.jpg', this)">
          <img src="tech 2.jpg" id="thumb-1-img" alt="Miniatura 1">
        </button>
        <button class="thumb-btn" onclick="cambiarImagenPrincipal('tech 2.1.jpg', this)">
          <img src="tech 2.1.jpg" id="thumb-2-img" alt="Miniatura 2">
        </button>
      </div>
    </div>

    <div class="product-details">
      <div class="breadcrumb">Inicio / Nike tech</div>
      <h1 class="product-title" id="prod-title">Sudadera nike tech</h1>
      <div class="product-price" id="precio">$250.000</div>

      <div class="section-label">Color</div>
      <div class="colors-grid">
        <button class="color-btn active" onclick="selectColor('Negro', this)">
          <span class="color-swatch Negro"></span> Negro
        </button>
        <button class="color-btn" onclick="selectColor('Blanco', this)">
          <span class="color-swatch Blanco"></span> Blanco
        </button>
      </div>

      <div class="section-label">Talla</div>
      <div class="sizes-grid">
        <button class="size-btn active" data-talla="S" onclick="selectSize('S', this)">S</button>
        <button class="size-btn" data-talla="M" onclick="selectSize('M', this)">M</button>
        <button class="size-btn" data-talla="L" onclick="selectSize('L', this)">L</button>
        <button class="size-btn" data-talla="XL" onclick="selectSize('XL', this)">XL</button>
        <button class="size-btn" data-talla="XXL" onclick="selectSize('XXL', this)">XXL</button>
      </div>

      <div class="stock-info" id="stock-display">Disponibles: 0 unidades</div>

      <div class="admin-stock-panel" id="admin-panel">
        <strong>[MODO ADMIN]</strong> Stock Talla <span id="admin-talla-lbl">S</span>: <span id="admin-stock-val">0</span> unidades.
      </div>

      <div class="purchase-row">
        <div class="quantity-selector">
          <button class="quantity-btn" onclick="changeQty(-1)">-</button>
          <input type="text" class="quantity-input" id="qty" value="1" readonly>
          <button class="quantity-btn" onclick="changeQty(1)">+</button>
        </div>
        
        <button class="btn-cart" id="btn-add" onclick="addToCart()">🛒 Agregar al Carrito</button>
      </div>

    </div>
  </div>

  <div class="modal-editor" id="modalEditor">
    <div class="modal-content">
      <h3>Panel de Administración</h3>
      <div id="bloquePass">
        <label style="font-size: 0.8rem; display:block; margin-bottom: 5px;">Contraseña Admin:</label>
        <input type="password" id="passInput" style="width: 100%; padding: 8px; background: #121212; border: 1px solid #444; color: white; border-radius: 4px;">
        <button onclick="verificarPass()" style="width: 100%; margin-top: 8px; padding: 8px; background: #333; color: white; border: 1px solid #555; border-radius: 4px; cursor: pointer;">Entrar</button>
      </div>
      <div id="bloqueAdminContenido" style="display: none;">
        <hr style="border:0; border-top:1px solid #333; margin: 15px 0;">
        
        <div style="font-size: 0.85rem; font-weight: bold; color: #00ff88; margin-bottom: 8px;">Gestionar Imágenes:</div>
        <label style="font-size: 0.75rem; display:block; margin-bottom: 3px; color: #ccc;">Ruta Imagen 1:</label>
        <input type="text" id="input-img-1" style="width: 100%; padding: 6px; background: #121212; border: 1px solid #444; color: #fff; border-radius: 4px; font-size: 0.8rem; margin-bottom: 8px;">
        
        <label style="font-size: 0.75rem; display:block; margin-bottom: 3px; color: #ccc;">Ruta Imagen 2:</label>
        <input type="text" id="input-img-2" style="width: 100%; padding: 6px; background: #121212; border: 1px solid #444; color: #fff; border-radius: 4px; font-size: 0.8rem; margin-bottom: 15px;">

        <div style="font-size: 0.85rem; font-weight: bold; color: #00ff88; margin-bottom: 8px;">Gestionar Stock por Color:</div>
        <div id="inputsStockContainer"></div>

        <button class="btn-guardar-admin" onclick="guardarCambiosAdmin()">Guardar Cambios</button>
      </div>
      <button class="btn-cerrar-modal" onclick="cerrarModal()">Cancelar / Cerrar</button>
    </div>
  </div>

  <script>
    const CLAVE_ADMIN = "9876";
    const STORAGE_KEY_INV = 'inventarioSudaderaNikeTech';
    const STORAGE_KEY_IMG1 = 'imagen1SudaderaNikeTech';
    const STORAGE_KEY_IMG2 = 'imagen2SudaderaNikeTech';

    const stockInicial = {
      'Negro': { 'S': 0, 'M': 0, 'L': 0, 'XL': 0, 'XXL': 0 },
      'Blanco': { 'S': 0, 'M': 0, 'L': 0, 'XL': 0, 'XXL': 0 }
    };

    let inventario = JSON.parse(localStorage.getItem(STORAGE_KEY_INV)) || stockInicial;
    let img1Actual = localStorage.getItem(STORAGE_KEY_IMG1) || 'tech 2.jpg';
    let img2Actual = localStorage.getItem(STORAGE_KEY_IMG2) || 'tech 2.1.jpg';
    let imagenSeleccionadaActual = img1Actual;

    let selectedColor = 'Negro';
    let selectedSize = 'S';
    let currentQty = 1;
    const precioNumerico = 250000;

    // Inicializar imágenes en la interfaz al cargar
    aplicarImagenesEnDOM();

    function aplicarImagenesEnDOM() {
      document.getElementById('main-img').src = img1Actual;
      document.getElementById('thumb-1-img').src = img1Actual;
      document.getElementById('thumb-2-img').src = img2Actual;
      imagenSeleccionadaActual = img1Actual;
    }

    function cambiarImagenPrincipal(rutaImg, elementoBtn) {
      imagenSeleccionadaActual = rutaImg;
      document.getElementById('main-img').src = rutaImg;

      document.querySelectorAll('.thumb-btn').forEach(btn => btn.classList.remove('active'));
      elementoBtn.classList.add('active');
    }

    function selectColor(color, element) {
      selectedColor = color;
      document.querySelectorAll('.color-btn').forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');
      actualizarInterfazStock();
    }

    function selectSize(size, element) {
      selectedSize = size;
      document.querySelectorAll('.size-btn').forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');
      actualizarInterfazStock();
    }

    function actualizarInterfazStock() {
      inventario = JSON.parse(localStorage.getItem(STORAGE_KEY_INV)) || stockInicial;
      
      const botonesTalla = document.querySelectorAll('.size-btn');
      let stockActualTallaSeleccionada = 0;

      botonesTalla.forEach(btn => {
        const talla = btn.getAttribute('data-talla');
        const stock = (inventario[selectedColor] && inventario[selectedColor][talla] !== undefined) ? inventario[selectedColor][talla] : 0;

        btn.classList.remove('out-of-stock');
        if (stock <= 0) {
          btn.classList.add('out-of-stock');
        }

        if (talla === selectedSize) {
          stockActualTallaSeleccionada = stock;
        }
      });

      resetQty();
      updateStockDisplay(stockActualTallaSeleccionada);
      actualizarVistaAdmin(stockActualTallaSeleccionada);

      const btnAdd = document.getElementById('btn-add');
      if (stockActualTallaSeleccionada > 0) {
        btnAdd.disabled = false;
      } else {
        btnAdd.disabled = true;
      }
    }

    function resetQty() {
      currentQty = 1;
      document.getElementById('qty').value = currentQty;
    }

    function updateStockDisplay(stock) {
      const stockDisplay = document.getElementById('stock-display');

      if (stock > 0) {
        stockDisplay.innerText = `Disponibles: ${stock} unidades (${selectedColor} / Talla ${selectedSize})`;
        stockDisplay.className = "stock-info";
      } else {
        stockDisplay.innerText = `Agotado en color ${selectedColor} / Talla ${selectedSize}`;
        stockDisplay.className = "stock-info out";
      }
    }

    function changeQty(amount) {
      inventario = JSON.parse(localStorage.getItem(STORAGE_KEY_INV)) || stockInicial;
      const maxStock = (inventario[selectedColor] && inventario[selectedColor][selectedSize]) || 0;
      if (maxStock === 0) return;

      if (currentQty + amount >= 1 && currentQty + amount <= maxStock) {
        currentQty += amount;
        document.getElementById('qty').value = currentQty;
      }
    }

    function addToCart() {
      inventario = JSON.parse(localStorage.getItem(STORAGE_KEY_INV)) || stockInicial;
      const maxStock = (inventario[selectedColor] && inventario[selectedColor][selectedSize]) || 0;

      if (maxStock === 0) {
        alert('Esta combinación de color y talla se encuentra agotada por el momento.');
        return;
      }

      let carrito = JSON.parse(localStorage.getItem('miCarrito')) || [];
      const tituloProd = document.getElementById('prod-title').innerText;
      const nombreProd = `${tituloProd} (${selectedColor} - ${selectedSize})`;

      let productoExistente = carrito.find(item => item.nombre === nombreProd);

      if (productoExistente) {
        if (productoExistente.cantidad + currentQty > maxStock) {
          alert(`No puedes agregar más unidades. El stock máximo para este producto es ${maxStock}.`);
          return;
        }
        productoExistente.cantidad += currentQty;
      } else {
        carrito.push({
          nombre: nombreProd,
          precio: precioNumerico,
          color: selectedColor,
          talla: selectedSize,
          cantidad: currentQty,
          imagen: imagenSeleccionadaActual
        });
      }

      localStorage.setItem('miCarrito', JSON.stringify(carrito));
      alert(`¡Agregado! ${currentQty} unidad(es) de ${nombreProd}`);
      window.location.href = "Carrito.html";
    }

    function abrirEditorStock() {
      document.getElementById('passInput').value = '';
      document.getElementById('bloquePass').style.display = 'block';
      document.getElementById('bloqueAdminContenido').style.display = 'none';
      document.getElementById('modalEditor').style.display = 'flex';
    }

    function verificarPass() {
      const inputPass = document.getElementById('passInput').value;
      if (inputPass !== CLAVE_ADMIN) {
        alert("Clave incorrecta.");
        return;
      }
      cargarPanelAdmin();
    }

    function cargarPanelAdmin() {
      document.getElementById('bloquePass').style.display = 'none';
      const bloqueAdmin = document.getElementById('bloqueAdminContenido');
      bloqueAdmin.style.display = 'block';

      // Cargar rutas actuales de imágenes
      img1Actual = localStorage.getItem(STORAGE_KEY_IMG1) || 'tech 2.jpg';
      img2Actual = localStorage.getItem(STORAGE_KEY_IMG2) || 'tech 2.1.jpg';
      document.getElementById('input-img-1').value = img1Actual;
      document.getElementById('input-img-2').value = img2Actual;

      // Cargar campos de stock por color y talla
      const contenedorStock = document.getElementById('inputsStockContainer');
      contenedorStock.innerHTML = '';

      inventario = JSON.parse(localStorage.getItem(STORAGE_KEY_INV)) || stockInicial;

      Object.keys(inventario).forEach(color => {
        contenedorStock.innerHTML += `<div style="font-size: 0.8rem; font-weight:bold; color:#ccc; margin-top:8px; margin-bottom:4px;">Color: ${color}</div>`;
        Object.keys(inventario[color]).forEach(talla => {
          const valStock = inventario[color][talla];
          contenedorStock.innerHTML += `
            <div class="fila-stock">
              <span style="font-size: 0.85rem;">Talla <strong>${talla}</strong>:</span>
              <input type="number" id="input-stock-${color}-${talla}" min="0" value="${valStock}">
            </div>
          `;
        });
      });
    }

    function guardarCambiosAdmin() {
      // Guardar imágenes
      const nuevaImg1 = document.getElementById('input-img-1').value.trim();
      const nuevaImg2 = document.getElementById('input-img-2').value.trim();
      
      if (nuevaImg1) {
        img1Actual = nuevaImg1;
        localStorage.setItem(STORAGE_KEY_IMG1, img1Actual);
      }
      if (nuevaImg2) {
        img2Actual = nuevaImg2;
        localStorage.setItem(STORAGE_KEY_IMG2, img2Actual);
      }

      aplicarImagenesEnDOM();

      // Guardar stock
      Object.keys(inventario).forEach(color => {
        Object.keys(inventario[color]).forEach(talla => {
          const input = document.getElementById(`input-stock-${color}-${talla}`);
          if (input) {
            const val = parseInt(input.value);
            inventario[color][talla] = isNaN(val) ? 0 : val;
          }
        });
      });

      localStorage.setItem(STORAGE_KEY_INV, JSON.stringify(inventario));
      cerrarModal();
      actualizarInterfazStock();
      alert("¡Cambios guardados correctamente!");
    }

    function cerrarModal() {
      document.getElementById('modalEditor').style.display = 'none';
    }

    function actualizarVistaAdmin(stock) {
      document.getElementById('admin-talla-lbl').innerText = selectedSize || 'N/A';
      document.getElementById('admin-stock-val').innerText = stock;
    }

    actualizarInterfazStock();
  </script>

</body>
</html>
